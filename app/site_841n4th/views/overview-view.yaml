path: admin-overview
title: Overview
badges:
  - entity: binary_sensor.work_day
  - entity: person.oren
  - entity: person.jose
  - entity: sensor.time_online
  - entity: sensor.jewish_calendar_holiday
  - entity: sensor.jewish_calendar_date
  - entity: sensor.local_ip
  # front door lock decoded status (live Z-Wave names)
  - entity: sensor.front_door_lock_alarmtype
  - entity: sensor.front_door_lock_alarmlevel
  - entity: sun.sun
cards:
  - !include /config/app/active/components/presence.yaml
  - type: picture-glance
    entity: person.oren
    entities:
      - entity: device_tracker.pixel_10_pro_fold
        icon: mdi:cellphone-android
    state_image:
      "home": !secret oren_profile_home
      "not_home": !secret oren_profile_away
    title: "Oren"
  - type: entities
    entities:
      - input_select.waze_destination
    title: Destination
  - type: entities
    entities:
      - light.back_stoop
      - light.front_stoop
      - light.back_yard_switch_basic
      - light.front_steps_switch_basic
      - group.front_bathroom_lights
      - group.front_bedroom_lights
      - light.bedroom_1
      - light.bedroom_2
      - light.bedroom_3
      - light.bedroom_4
      - light.kitchen
      - light.kitchen_1
      - light.kitchen_2
      - light.kitchen_window
      - light.living_room
      - light.living_room_left_1
      - light.living_room_left_2
      - light.living_room_right_1
      - light.living_room_right_2
      - light.living_room_right_3
      - light.living_room_lamp_1
      - light.master_bathroom
      - light.master_bathroom_1
      - light.master_bathroom_3
      - light.master_bathroom_4
      - light.master_bedroom
      - light.master_bedroom_2
      - light.master_bedroom_lamp
      - light.master_bedroom_fan_1
      - light.master_bedroom_fan_2
      - light.master_bedroom_fan_3
      - light.floor_lamp_1
      - light.floor_lamp_2
      - light.floor_lamp_3
      - light.powder_room_1
      - light.powder_room_2
      - light.stairs
      - light.downstairs
      - light.upstairs
      - light.hallway_track_light_switch
    title: Lights
  - type: entities
    entities:
      - lock.front_door_lock
    title: Lock
  # Media (live players; expand later)
  - type: media-control
    entity: media_player.first_floor
  - type: media-control
    entity: media_player.kitchen_assistant
  - type: media-control
    entity: media_player.master_bedroom_tv
  - type: entities
    entities:
      - switch.ceiling_left_switch
      - switch.ceiling_right_switch
      - switch.right_outlet_1
      - switch.back_yard_switch
      - switch.hallway_outlet_2
      - switch.hallway_outlet_3
      - switch.kitchen_light_switch
      - switch.kitchen_passthrough_switch
      - switch.powder_room_light_switch_3
      - switch.exhaust_fan_switch_4
      - switch.stairs_light_switch
    title: Switches
  - type: weather-forecast
    entity: weather.forecast_home
    name: 841 Forecast
    show_forecast: true
  - type: entities
    entities:
      - vacuum.maria
    title: Vacuums
