path: security
title: Security
icon: mdi:shield-home
badges:
  - entity: lock.front_door_lock
  - entity: sensor.front_door_lock_alarmtype
  - entity: sensor.front_door_lock_alarmlevel
cards:
  # Lock
  - type: entities
    title: Front Door
    state_color: true
    entities:
      - entity: lock.front_door_lock
        name: Front Door Lock
      - entity: binary_sensor.front_door_lock_the_current_status_of_the_door
        name: Door
      - type: divider
      - entity: sensor.last_action
        name: Last action

  # Cameras (live UniFi/Protect feeds) with motion badges
  - type: horizontal-stack
    cards:
      - type: picture-glance
        title: East
        camera_image: camera.east_high_resolution_channel
        camera_view: live
        entities:
          - entity: binary_sensor.east_motion
            icon: mdi:motion-sensor
      - type: picture-glance
        title: North
        camera_image: camera.north_high_resolution_channel
        camera_view: live
        entities:
          - entity: binary_sensor.north_motion
            icon: mdi:motion-sensor
  - type: horizontal-stack
    cards:
      - type: picture-glance
        title: South
        camera_image: camera.south_high_resolution_channel
        camera_view: live
        entities:
          - entity: binary_sensor.south_motion
            icon: mdi:motion-sensor
      - type: picture-glance
        title: West
        camera_image: camera.west_high_resolution_channel
        camera_view: live
        entities:
          - entity: binary_sensor.west_motion
            icon: mdi:motion-sensor

  # Doors / intrusion sensors
  - type: entities
    title: Doors & Intrusion
    state_color: true
    entities:
      - entity: binary_sensor.front_door_home_security_intrusion
        name: Front Door
      - entity: binary_sensor.back_gate_home_security_intrusion
        name: Back Gate
      - entity: binary_sensor.sliding_glass_door_home_security_intrusion
        name: Sliding Glass Door
      - entity: binary_sensor.front_bedroom_door_home_security_intrusion
        name: Front Bedroom Door
      - entity: binary_sensor.front_bathroom_home_security_intrusion
        name: Front Bathroom
      - entity: binary_sensor.master_bedroom_door_home_security_intrusion
        name: Master Bedroom Door
      - entity: binary_sensor.master_bathroom_door_home_security_intrusion
        name: Master Bathroom Door
      - entity: binary_sensor.powder_room_door_home_security_intrusion
        name: Powder Room Door
      - entity: binary_sensor.utility_closet_door_home_security_intrusion
        name: Utility Closet Door
      - entity: binary_sensor.shed_door_intrusion
        name: Shed Door
      - entity: binary_sensor.panic_button_home_security_intrusion
        name: Panic Button
      - entity: binary_sensor.living_room_button_home_security_intrusion
        name: Living Room Button

  # Lock health
  - type: entities
    title: Lock Health
    state_color: true
    entities:
      - entity: binary_sensor.front_door_lock_access_control_lock_jammed
        name: Jammed
      - entity: sensor.front_door_lock_battery_level
        name: Battery
      - entity: binary_sensor.front_door_lock_power_management_replace_battery_soon
        name: Replace battery soon
      - entity: binary_sensor.front_door_lock_power_management_replace_battery_now
        name: Replace battery now

  # Recent motion/security events
  - type: logbook
    title: Recent Events
    hours_to_show: 24
    entities:
      - binary_sensor.east_motion
      - binary_sensor.north_motion
      - binary_sensor.south_motion
      - binary_sensor.west_motion
      - lock.front_door_lock
      - binary_sensor.front_door_home_security_intrusion
