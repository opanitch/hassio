path: exterior
title: Exterior
badges:
  # time
  - entity: sun.sun
  - entity: sensor.moon_phase
  - entity: sensor.time
  # doors (intrusion) — closed vs open icon swap
  - type: entity-filter
    entities:
      - entity: binary_sensor.front_door_intrusion
        name: Front Door
        icon: mdi:door
    state_filter:
      - "off"
  - type: entity-filter
    entities:
      - entity: binary_sensor.front_door_intrusion
        name: Front Door
        icon: mdi:door-open
    state_filter:
      - "on"
  - type: entity-filter
    entities:
      - entity: binary_sensor.back_door_intrusion
        name: Back Door
        icon: mdi:door
    state_filter:
      - "off"
  - type: entity-filter
    entities:
      - entity: binary_sensor.back_door_intrusion
        name: Back Door
        icon: mdi:door-open
    state_filter:
      - "on"
  - type: entity-filter
    entities:
      - entity: binary_sensor.front_sliding_glass_door_intrusion
        name: Sliding Door
        icon: mdi:door-sliding
    state_filter:
      - "off"
  - type: entity-filter
    entities:
      - entity: binary_sensor.front_sliding_glass_door_intrusion
        name: Sliding Door
        icon: mdi:door-sliding-open
    state_filter:
      - "on"
cards:
  # Combined Doors card: both locks with tap-to-toggle + last action readout
  - type: vertical-stack
    title: Doors
    cards:
      # front door lock
      - type: conditional
        conditions:
          - entity: lock.front_door_lock
            state: "locked"
        card:
          type: button
          name: Front Door
          entity: lock.front_door_lock
          tap_action:
            action: call-service
            service: lock.unlock
            data:
              entity_id: lock.front_door_lock
          hold_action:
            action: more-info
      - type: conditional
        conditions:
          - entity: lock.front_door_lock
            state: "unlocked"
        card:
          type: button
          name: Front Door
          entity: lock.front_door_lock
          tap_action:
            action: call-service
            service: lock.lock
            data:
              entity_id: lock.front_door_lock
          hold_action:
            action: more-info
      - type: entities
        entities:
          - entity: sensor.front_door_last_action
            name: Front — last action
      # back door lock
      - type: conditional
        conditions:
          - entity: lock.back_door_lock
            state: "locked"
        card:
          type: button
          name: Back Door
          entity: lock.back_door_lock
          tap_action:
            action: call-service
            service: lock.unlock
            data:
              entity_id: lock.back_door_lock
          hold_action:
            action: more-info
      - type: conditional
        conditions:
          - entity: lock.back_door_lock
            state: "unlocked"
        card:
          type: button
          name: Back Door
          entity: lock.back_door_lock
          tap_action:
            action: call-service
            service: lock.lock
            data:
              entity_id: lock.back_door_lock
          hold_action:
            action: more-info
      - type: entities
        entities:
          - entity: sensor.back_door_last_action
            name: Back — last action
  # date time
  - type: sensor
    entity: sensor.date_time_dashboard
    graph: none
    name: " "
  # weather (site forecast — hourly/daily)
  - type: weather-forecast
    entity: weather.827_pennlyn
    name: 827 Pennlyn Forecast
    show_forecast: true
