# =============================================================================
# secrets.example.yaml — TEMPLATE (keys only, NO real values)
# =============================================================================
# Copy this file to `secrets.yaml` and fill in real values for the target
# deployment. `secrets.yaml` is GITIGNORED and must NEVER be committed.
#
#   cp secrets.example.yaml secrets.yaml   # then edit
#
# Values below are placeholders. Per-site values (coordinates, URLs, hosts) are
# what differ between deployments (master vs shore-house); see BEST_PRACTICES.md
# (Secrets, Multi-Deployment Notes) and README.md.
#
# Keys marked (optional) back integrations that are currently commented out in
# config; only fill them in if/when you enable that integration.
# =============================================================================

# -----------------------------------------------------------------------------
# Site / URLs
# -----------------------------------------------------------------------------
# Site identity + coordinates for THIS machine's home. `site_*` always describes
# the location of the machine you're setting up — e.g. on the OC machine, set the
# site_* values to the Ocean City coordinates. The zone_<name>_* keys below are a
# shared catalog of known locations; a home defines only the zones it cares about.
# Real coordinates live in the LastPass coordinate catalog, not in git.
site_name: "841 N 4th"
site_latitude: 0.0
site_longitude: 0.0
site_elevation: 0
external_url: "https://YOUR-SUBDOMAIN.duckdns.org"
hass_base_url: "https://YOUR-SUBDOMAIN.duckdns.org"
hass_host: "192.168.1.x" # LAN IP of the HA host (optional: upnp)

# -----------------------------------------------------------------------------
# Home measurement / locale
# -----------------------------------------------------------------------------
zone_home_country: "US"
zone_home_currency: "USD"
zone_home_time_zone: "America/New_York"

# -----------------------------------------------------------------------------
# Zone coordinates (latitude / longitude / elevation)
# Fill in only the zones relevant to THIS deployment (each home carries its own
# set — a home need not define every zone below). Real coordinates are kept out
# of git: look them up from the coordinate catalog in LastPass when setting up a
# machine, and put the values in this machine's (gitignored) secrets.yaml.
# -----------------------------------------------------------------------------
# Generic "home" zone (used by jewish_calendar, etc.)
zone_home_lat: 0.0
zone_home_long: 0.0

# Oren Primary residence (841 N 4th)
zone_841n4th_lat: 0.0
zone_841n4th_long: 0.0
zone_841n4th_elev: 0

# Other tracked zones
# Parents' Primary residence (649 Oak Shade)
zone_649oak_lat: 0.0
zone_649oak_long: 0.0
zone_649oak_elev: 0
# Dad's Work (Children's Hospital)
zone_chop_lat: 0.0
zone_chop_long: 0.0
zone_chop_elev: 0
# Beck & John's Primary residence (504 Shoemaker)
zone_504shoe_lat: 0.0
zone_504shoe_long: 0.0
zone_504shoe_elev: 0
# Ocean City Primary residence (827 Pennlyn)
zone_ocnj_lat: 0.0
zone_ocnj_long: 0.0
zone_ocnj_elev: 0

# -----------------------------------------------------------------------------
# DuckDNS + TLS (authentication/)
# -----------------------------------------------------------------------------
duckdns_subdomain: "YOUR-SUBDOMAIN"
duckdns_token: "REPLACE_WITH_DUCKDNS_TOKEN"
server_port: 8123
ssl_certificate: "/ssl/fullchain.pem"
ssl_key: "/ssl/privkey.pem"

# -----------------------------------------------------------------------------
# Router / device tracker
# -----------------------------------------------------------------------------
router_host: "192.168.1.1"
router_user: "REPLACE_WITH_ROUTER_USER"   # (netgear tracker; not used by quantum_gateway)
router_password: "REPLACE_WITH_ROUTER_PASSWORD"

# -----------------------------------------------------------------------------
# Climate — Nest (Device Access)
# -----------------------------------------------------------------------------
nest_client_id: "REPLACE_WITH_NEST_CLIENT_ID"
nest_client_secret: "REPLACE_WITH_NEST_CLIENT_SECRET"
nest_project_id: "REPLACE_WITH_NEST_PROJECT_ID"

# -----------------------------------------------------------------------------
# Media
# -----------------------------------------------------------------------------
plex_server_host: "192.168.1.x"
plex_server_port: 32400
plex_server_token: "REPLACE_WITH_PLEX_TOKEN"
yamaha_receiver_host: "192.168.1.x" # (optional)

# -----------------------------------------------------------------------------
# Cleaning — Roomba/iRobot (now UI-configured; kept for legacy/reference)
# -----------------------------------------------------------------------------
roomba_host: "192.168.1.x"
roomba_username: "REPLACE_WITH_ROOMBA_BLID"
roomba_password: "REPLACE_WITH_ROOMBA_PASSWORD"

# -----------------------------------------------------------------------------
# Z-Wave / Zigbee / MQTT networks
# -----------------------------------------------------------------------------
zwave_network_key: "0x00, 0x00, 0x00, ..." # (optional)

# -----------------------------------------------------------------------------
# Remotes / hubs
# -----------------------------------------------------------------------------
harmony_hub_host: "192.168.1.x"
hue_bridge_host: "192.168.1.x" # (optional)
vera_hub_url: "http://192.168.1.x:3480" # (optional)

# -----------------------------------------------------------------------------
# Frontend / add-ons
# -----------------------------------------------------------------------------
hacs_token: "REPLACE_WITH_GITHUB_TOKEN" # (optional: HACS)
lifx_api_token: "REPLACE_WITH_LIFX_TOKEN" # (optional: LIFX scenes)

# -----------------------------------------------------------------------------
# Optional / commented integrations
# -----------------------------------------------------------------------------
epson_printer_host: "192.168.1.x" # (optional)
steam_api_key: "REPLACE_WITH_STEAM_API_KEY"
steam_account_opanitch: "REPLACE_WITH_STEAM_UID"
xbox_api_key: "REPLACE_WITH_XBOX_API_KEY" # (optional)
xbox_account_oreokid200: "REPLACE_WITH_XUID" # (optional)
zillow_api_key: "REPLACE_WITH_ZILLOW_KEY" # (optional)
zillow_home_id: "REPLACE_WITH_ZILLOW_HOME_ID" # (optional)

# -----------------------------------------------------------------------------
# People — HA person `id` and linked HA `user_id`
# (one id per tracked resident; user_id only for those with HA logins)
# -----------------------------------------------------------------------------
oren_id: "REPLACE"
oren_user_id: "REPLACE"
