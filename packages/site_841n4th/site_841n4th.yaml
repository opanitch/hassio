# =============================================================================
# Site package: 841 N 4th (main house)
# =============================================================================
# Loaded when `packages/active` -> `site_841n4th` (per-machine symlink).
# See packages/README.md. Only site-specific config belongs here; anything
# shared across homes stays in the top-level config.
#
# Domains here are supported package domains (person, zone, homeassistant.customize).
# Lovelace dashboards are NOT packages and are handled separately.
# =============================================================================

# People tracked at this home
person: !include_dir_list packages/active/people/

# Zones relevant to this home
zone: !include_dir_list packages/active/zones/

# Per-entity UI customizations for this home's people
homeassistant:
  customize: !include_dir_named packages/active/customizations/

# Site-only devices/integrations (this home has a Nest; shore uses a UI-configured
# Honeywell Lyric with no YAML). Keeping nest here means shore never loads it and
# never needs nest_* secrets.
nest: !include packages/active/nest_config.yaml
