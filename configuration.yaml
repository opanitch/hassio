# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  # Site identity/location are per-machine via secrets (see packages/README.md).
  # The active site's people/zones/customizations load via packages/active.
  name: !secret site_name
  # access
  auth_providers: !include authentication/default.yaml
  auth_mfa_modules: !include authentication/mfa_config.yaml
  external_url: !secret external_url
  internal_url: !secret internal_url
  # location
  country: !secret zone_home_country
  elevation: !secret site_elevation
  latitude: !secret site_latitude
  longitude: !secret site_longitude
  time_zone: !secret zone_home_time_zone
  # measurement units
  currency: !secret zone_home_currency
  unit_system: us_customary
  # Per-site config (people, zones, customizations, site devices).
  # packages/active is a per-machine symlink -> packages/site_<home>/
  packages: !include_dir_named packages/active/

# External
http: !include authentication/http_config.yaml

# Enablers
browser:
cloud:
config:
conversation:
# discovery: # prefer manual configuration
frontend:
map:
schedule:
# https://www.home-assistant.io/integrations/ios/
# ios: # only need if more than 1 iPhone user needs the app. no use case now
## UI Configuration — per-site via the app/active symlink (see packages/README.md)
# https://www.home-assistant.io/lovelace/dashboards-and-views/
lovelace: !include app/active/config/ui-config.yaml
mobile_app:
my:
sun:
stream:
system_health:

## Text to speech
tts: !include integrations/tts/tts_config.yaml

### House Settings
# areas: !include area_config.yaml
# NOTE: automations and groups are site-specific and live in the active site
# package (packages/site_<home>/). Not shared here.
history:
# history_graph: !include history_graph_config.yaml
# NOTE: person:, zone:, switch:, input_number:, input_select: are now provided
# per-site via packages/active (see packages/README.md). Do not re-add here.
# scene: removed — no live scenes on either home; add per-site if needed later.

### Integrations
# All device/site integrations (lights, sensors, templates, etc.) are per-site —
# see the active site package. Only tts (generic, identical across homes) is shared.
# device_tracker is per-site too (router hardware differs per home).
